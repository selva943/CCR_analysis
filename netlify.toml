[build]
  command = "node netlify_build.cjs"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/dashboard/"
  status = 301

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No content hashing in filenames - app assets must revalidate quickly so
# config.js / metrics / ui edits reach returning users without a hard refresh.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/Input/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"